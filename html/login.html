<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | MyShop</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

    <nav>

        <div class="logo">
            <img src="../images/logo.png" alt="MyShop Logo">
            <h2>MyShop</h2>
        </div>

        <ul>
            <li><a href="index.html">🏠 Home</a></li>
            <li><a href="products.html">🛍 Products</a></li>
            <li><a href="contact.html">📞 Contact</a></li>
        </ul>

    </nav>

</header>


<!-- ================= ADMIN LOGIN ================= -->

<main>

    <h1 class="page-title">Admin Login</h1>

    <div class="login-box">

        <h2>Admin Access</h2>

        <input
            type="email"
            id="email"
            placeholder="Enter admin email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Enter admin password"
            required
        >

        <button id="loginBtn">
            Login
        </button>

    </div>

</main>


<!-- ================= FOOTER ================= -->

<footer class="footer">

    <div class="footer-content">

        <h3>MyShop</h3>

        <p>Your trusted online shopping website.</p>

        <p>Email: support@myshop.com</p>

        <p>Phone: +212 600 000 000</p>

        <p>Address: Casablanca, Morocco</p>

        <div class="footer-links">

            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="contact.html">Contact</a>

        </div>

        <p>&copy; 2026 MyShop. All Rights Reserved.</p>

    </div>

</footer>


<script src="../js/login.js"></script>

</body>
</html>
